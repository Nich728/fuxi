# Developer commands. Install Task from https://taskfile.dev, then run `task --list`.
# Task replaces make so the same commands work on Windows, macOS and Linux (ADR-0017).
version: "3"

vars:
  COMPOSE: docker compose -f deploy/docker-compose.yml
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  # Where downloaded datasets live. Set FUXI_DATA_DIR to keep them off a small drive.
  DATA_DIR: '{{.FUXI_DATA_DIR | default ".data"}}'
  # Dataset sources (SYSTEM_DESIGN §5). The HSK list is pinned to a commit.
  CEDICT_URL: https://www.mdbg.net/chinese/export/cedict/cedict_1_0_ts_utf-8_mdbg.txt.gz
  HSK_URL: https://raw.githubusercontent.com/harukicoder/hsk30/36c0d11347b5d4caea52917d1262404824ad58d5/corpus/syllabus2025/syllabus2025_words.tsv
  TATOEBA: https://downloads.tatoeba.org/exports/per_language

env:
  # The Compose Postgres is published on 5433 (see deploy/docker-compose.yml).
  FUXI_DATABASE_URL: postgres://fuxi:fuxi@localhost:5433/fuxi?sslmode=disable
  # Host runs are local development: no Cloudflare in front (ADR-0018).
  FUXI_AUTH: '{{.FUXI_AUTH | default "dev"}}'

tasks:
  default:
    cmds: [task --list]
    silent: true

  up:
    desc: Build and start Postgres, migrations, API and worker; wait until the API is ready
    cmds:
      - "{{.COMPOSE}} up -d --build --wait api worker"
      - task: health

  down:
    desc: Stop the local stack (keeps the database volume)
    cmds: ["{{.COMPOSE}} down"]

  reset:
    desc: Stop the stack and delete the local database volume
    prompt: This deletes all local database data. Continue?
    cmds: ["{{.COMPOSE}} down -v"]

  logs:
    desc: Follow logs from the local stack
    cmds: ["{{.COMPOSE}} logs -f"]

  db:
    desc: Start only Postgres (for running the API from your editor)
    cmds: ["{{.COMPOSE}} up -d --wait postgres"]

  health:
    desc: Call /healthz and /readyz on the local API
    cmds:
      - curl -fsS http://localhost:8080/healthz
      - curl -fsS http://localhost:8080/readyz

  build:
    desc: Build the fuxi binary into bin/
    cmds:
      - go build -trimpath -ldflags "-X main.version={{.VERSION}}" -o bin/fuxi{{exeExt}} ./cmd/fuxi

  run:api:
    desc: Run the API on the host against the Compose Postgres
    deps: [db]
    cmds: [go run ./cmd/fuxi api]

  run:worker:
    desc: Run the job worker on the host against the Compose Postgres
    deps: [db]
    cmds: [go run ./cmd/fuxi worker]

  migrate:
    desc: "Run a migration command on the host, e.g. task migrate -- status"
    deps: [db]
    cmds: ["go run ./cmd/fuxi migrate {{.CLI_ARGS | default \"up\"}}"]

  migrate:new:
    desc: "Create a new SQL migration, e.g. task migrate:new -- create_users"
    requires:
      vars: [CLI_ARGS]
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose@v3.30.0 -dir db/migrations -s create {{.CLI_ARGS}} sql

  sqlc:
    desc: Regenerate Go code from db/queries with sqlc (runs in Docker)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/src" -w /src sqlc/sqlc:1.31.1 generate

  data:download:
    desc: Download CC-CEDICT, the HSK 3.0 syllabus list and Tatoeba into DATA_DIR
    cmds:
      - mkdir -p "{{.DATA_DIR}}"
      - curl -fL --retry 3 -o "{{.DATA_DIR}}/cedict_ts.u8.gz" {{.CEDICT_URL}}
      - curl -fL --retry 3 -o "{{.DATA_DIR}}/syllabus2025_words.tsv" {{.HSK_URL}}
      - curl -fL --retry 3 -o "{{.DATA_DIR}}/cmn_sentences.tsv.bz2" {{.TATOEBA}}/cmn/cmn_sentences.tsv.bz2
      - curl -fL --retry 3 -o "{{.DATA_DIR}}/eng_sentences.tsv.bz2" {{.TATOEBA}}/eng/eng_sentences.tsv.bz2
      - curl -fL --retry 3 -o "{{.DATA_DIR}}/cmn-eng_links.tsv.bz2" {{.TATOEBA}}/cmn/cmn-eng_links.tsv.bz2

  data:import:
    desc: Import the downloaded datasets into the local database (order matters; repeats are no-ops)
    deps: [migrate]
    cmds:
      - go run ./cmd/fuxi import cedict "{{.DATA_DIR}}/cedict_ts.u8.gz"
      - go run ./cmd/fuxi import hsk "{{.DATA_DIR}}/syllabus2025_words.tsv"
      - go run ./cmd/fuxi import tatoeba "{{.DATA_DIR}}/cmn_sentences.tsv.bz2" "{{.DATA_DIR}}/eng_sentences.tsv.bz2" "{{.DATA_DIR}}/cmn-eng_links.tsv.bz2"

  test:
    desc: Run all tests, including integration tests (needs Docker)
    cmds:
      # -race needs a 64-bit C compiler, which Windows lacks by default; CI (Linux) always runs it.
      # On Windows, testcontainers sometimes fails to detect Docker when several test
      # packages start Postgres at once ("rootless Docker is not supported"); naming
      # the Docker Desktop pipe skips the detection.
      - '{{if eq OS "windows"}}DOCKER_HOST={{.DOCKER_HOST | default "npipe:////./pipe/docker_engine"}} {{end}}go test {{if ne OS "windows"}}-race {{end}}-count=1 ./...'

  test:short:
    desc: Run unit tests only (no Docker)
    cmds: [go test -short ./...]

  lint:
    desc: Run go vet and golangci-lint
    cmds:
      - go vet ./...
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run

  tidy:
    desc: Tidy go.mod and format code
    cmds:
      - go mod tidy
      - gofmt -s -w .
