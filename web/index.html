<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fuxi</title>
    <meta name="description" content="Mandarin reviews, a dictionary and a tutor." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#151615" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // The theme before first paint (src/lib/theme.ts): Ink unless this device chose Paper or Match device.
      try {
        var t = localStorage.getItem('fuxi.theme')
        var paper = t === 'paper' || (t === 'auto' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = t === 'paper' || t === 'auto' ? t : 'ink'
        if (paper) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#EEEAE1')
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fuxi" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Serif:ital,wght@0,400;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
